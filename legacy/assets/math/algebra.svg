    <text x="128" y="36">y</text>
    <text x="106" y="226">0</text>
  </g>
  <rect x="226" y="52" width="140" height="48" rx="10" fill="#04aaf7"/>
  <text x="296" y="84" font-family="Raleway, Inter, sans-serif" font-weight="500" font-size="24" fill="#ffffff" text-anchor="middle">y = 2x + 1</text>
  <g font-family="Inter, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.75">
    <text x="232" y="136">a₁, a₂, a₃ …</text>
    <text x="232" y="160">aₙ = a₁ + (n − 1)d</text>
  </g>
</svg>
