<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <title>Шугаман функц, түүний график</title>
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M30 30V270 M60 30V270 M90 30V270 M150 30V270 M180 30V270 M210 30V270 M240 30V270 M270 30V270 M300 30V270 M330 30V270 M360 30V270"/>
    <path d="M30 30H360 M30 60H360 M30 90H360 M30 120H360 M30 150H360 M30 180H360 M30 240H360 M30 270H360"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
    <path d="M30 210H364"/>
    <path d="M120 274V26"/>
  </g>
  <path d="M364 210l-8 -5v10z M120 26l-5 8h10z" fill="#ffffff" fill-opacity="0.6"/>
  <path d="M75 270 L195 30" stroke="#04aaf7" stroke-width="4" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#04aaf7" stroke-width="3">
