<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" fill="none">
  <title>Математик 7 сурах бичиг</title>
  <defs>
    <linearGradient id="cover" x1="40" y1="20" x2="290" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fbdfb"/>
      <stop offset="1" stop-color="#0373a8"/>
    </linearGradient>
  </defs>
  <!-- Хуудаснууд -->
  <rect x="58" y="34" width="236" height="346" rx="10" fill="#e9e4d8"/>
  <path d="M290 46V368" stroke="#cfc8b8" stroke-width="2"/>
  <path d="M284 42V372" stroke="#cfc8b8" stroke-width="2"/>
  <!-- Хавтас -->
  <rect x="36" y="20" width="244" height="350" rx="10" fill="url(#cover)"/>
  <rect x="36" y="20" width="22" height="350" rx="6" fill="#025f8c"/>
  <!-- Чимэглэл -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M80 300 L250 210"/>
