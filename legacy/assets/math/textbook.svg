  </g>
  <text x="76" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#ffffff" fill-opacity="0.8">СУРАХ БИЧИГ</text>
  <text x="76" y="122" font-family="Raleway, Inter, sans-serif" font-size="32" font-weight="500" fill="#ffffff">МАТЕМАТИК</text>
  <text x="250" y="220" font-family="Raleway, Inter, sans-serif" font-size="120" font-weight="500" fill="#ffffff" text-anchor="end">7</text>
  <text x="76" y="150" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.85">Суурь боловсрол</text>
  <g font-family="Raleway, Inter, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.55">
    <text x="190" y="304">π</text>
    <text x="96" y="340">y = kx + b</text>
